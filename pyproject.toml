[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devaci"
version = "1.0.0"
description = "Python library that generates Cisco ACI configuration and optionally pushes it to an APIC controller via Cisco's official Cobra SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jorge Riveros" },
]
keywords = ["cisco", "aci", "apic", "cobra", "networking", "sdn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    # Note: the Cisco ACI Cobra SDK (acicobra, acimodel, aciparser, acirpc)
    # is distributed as .whl/.egg by Cisco and is NOT on PyPI.
    # Install it separately before using devaci.
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/cocuni80/devaci"
Repository = "https://github.com/cocuni80/devaci"
Issues = "https://github.com/cocuni80/devaci/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/devaci"]
exclude = ["src/devaci/_legacy"]

[tool.hatch.build.targets.sdist]
include = ["src/devaci", "tests", "README.md", "LICENSE"]
exclude = ["src/devaci/_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["devaci"]
omit = ["*/_legacy/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["src/devaci/_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Cobra SDK convention uses PascalCase locals mirroring Mo class names,
# and the legacy handlers use nested `if` guards (kept verbatim).
"src/devaci/cobra/builders.py" = ["N806", "SIM102"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
exclude = ["_legacy"]

[[tool.mypy.overrides]]
module = ["cobra", "cobra.*", "jinja2", "pandas"]
ignore_missing_imports = true
